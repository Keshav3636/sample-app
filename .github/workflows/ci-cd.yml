name: CI-CD - sample-app (local, zero-cost)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm test

  security-scan:
    name: Security Scan (filesystem)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'

  build-and-deploy-local:
    name: Docker Build + Deploy to local kind cluster
    needs: [build-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (local only, no push)
        run: docker build -t sample-app:${{ github.sha }} .

      - name: Create local Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: demo-cluster

      - name: Load image into kind (no registry needed)
        run: kind load docker-image sample-app:${{ github.sha }} --name demo-cluster

      - name: Set image tag and deploy
        run: |
          sed -i "s|PLACEHOLDER_IMAGE|sample-app:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/sample-app --timeout=120s

      - name: Smoke test the deployed service
        run: |
          kubectl port-forward svc/sample-app 8080:80 &
          sleep 3
          curl -sf http://localhost:8080/health

  ai-summary:
    name: GenAI Deployment Summary (free, GitHub Models)
    needs: build-and-deploy-local
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate summary via GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(git log -5 --pretty=format:"%h %s")
          curl -s https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg commits "$COMMITS" '{
              model: "openai/gpt-4o-mini",
              messages: [
                {role: "system", content: "Summarize this deployment for a release note. Be concise."},
                {role: "user", content: $commits}
              ]
            }')" | jq -r '.choices[0].message.content' > deployment-summary.md

      - name: Post to job summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          cat deployment-summary.md >> "$GITHUB_STEP_SUMMARY"
